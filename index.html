  .vinyl-ring::after {
    content: "";

<body>
<div class="card">
  <div class="vinyl-ring" id="vinylRing" aria-hidden="true" title="��һ�£��úڽ�ת����"></div><div class="vinyl-hint">TOUCH TO PLAY</div>
  <div class="label-tag">The Miseducation of Lauryn Hill &middot; 1998</div>
  <h1>Ex-Factor</h1>
  <div class="artist">Lauryn Hill</div>

  <div class="divider"></div>

  <div class="lyric-block">
    <p>
      It could all be <em>so simple</em><br>
      But you&rsquo;d rather make it hard<br>
      Loving you is like a battle<br>
      And we both end up with scars
    </p>
  </div>

  <div class="meta-row">
    <span>R&amp;B / Neo-Soul</span>
    <span>5:26</span>
  </div>

  <div class="share-area">
    <div class="share-area">
</div>
    <div class="audio-player-section">

    <audio id="audioEl" preload="auto" src="https://music.163.com/song/media/outer/url?id=2926295.mp3"></audio>

    <div class="player-controls">
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-display">
        <span id="currentTime">0:00</span>
        <span class="time-sep">/</span>
        <span id="totalTime">5:26</span>
      </div>
    </div>

  </div>
<div class="footer-note">TURN IT UP &amp; LET IT BREATHE</div>
</div>

<script>
  const vinylRing = document.getElementById('vinylRing');
  vinylRing.addEventListener('click', () => {
    vinylRing.classList.toggle('playing');
    const hint = vinylRing.nextElementSibling;
    if (hint) hint.style.opacity = vinylRing.classList.contains('playing') ? '0' : '';
  });

  const audio = document.getElementById('audioEl');
  const progressFill = document.getElementById('progressFill');
  const progressTrack = document.getElementById('progressTrack');
  const currentTimeEl = document.getElementById('currentTime');
  const totalTimeEl = document.getElementById('totalTime');

  let isPlaying = false;

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  vinylRing.addEventListener('click', function() {
    if (isPlaying) {
      audio.pause();
    } else {
      audio.play().catch(function(){});
    }
  });

  audio.addEventListener('play', function() {
    isPlaying = true;
    vinylRing.classList.add('playing');
  });

  audio.addEventListener('pause', function() {
    isPlaying = false;
    vinylRing.classList.remove('playing');
  });

  audio.addEventListener('timeupdate', function() {
    if (audio.duration) {
      var pct = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = pct + '%';
      currentTimeEl.textContent = formatTime(audio.currentTime);
    }
  });

  audio.addEventListener('loadedmetadata', function() {
    totalTimeEl.textContent = formatTime(audio.duration);
  });

  audio.addEventListener('ended', function() {
    vinylRing.classList.remove('playing');
    isPlaying = false;
    progressFill.style.width = '0%';
    currentTimeEl.textContent = '0:00';
  });

  progressTrack.addEventListener('click', function(e) {
    if (!audio.duration) return;
    var rect = progressTrack.getBoundingClientRect();
    var pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;
  });
</script>
